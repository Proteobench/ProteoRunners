# =============================================================================
# ProteoBench Pipeline Configuration Template
# =============================================================================
#
# HOW TO USE THIS FILE
# --------------------
# Every search engine now runs inside its own docker container — there is
# nothing to compile or install natively. Docker itself must be installed
# and running (see README.md).
#
# 1. Run: nextflow run setup.nf
#    This pulls the docker image for each tool you choose, walks you through
#    the license prompts FragPipe and DIA-NN 2.x need, and writes config.yaml
#    containing only the tools it finished setting up. Re-running it later only
#    redoes the tools whose docker setup is incomplete and updates config.yaml
#    in place (keeping a config.yaml.bak copy), leaving everything else as-is.
# 2. In config.yaml, replace every remaining CHANGE_ME with a path on your
#    system (datasets, output_dir).
# 3. Run: python run_proteobench.py --dry-run   to verify before executing.
#
# All paths can be absolute (/full/path) or relative to the directory where
# you run the script. Absolute paths are recommended to avoid surprises.
#
# Run python run_proteobench.py --list-tools    to see which tools are enabled.
# Run python run_proteobench.py --list-datasets to see configured datasets.
# =============================================================================

global:
  # Where all result subdirectories will be created. The pipeline creates one
  # sub-folder per dataset and one per tool+version inside that.
  # e.g. /home/robbe/PB_output/results/Entrapment_DIA
  output_dir: CHANGE_ME/results

  # How many tool runs to execute simultaneously. Each run uses threads_per_job
  # threads, so total CPU load = max_parallel_jobs × threads_per_job.
  # Do not set this higher than (available_cores / threads_per_job).
  max_parallel_jobs: 2

  # Number of CPU threads given to each individual tool run.
  threads_per_job: 32

  # Set to true to re-run jobs that already completed successfully.
  # By default the pipeline writes a .done marker after each successful run
  # and skips that job in future runs (useful for resuming after interruption).
  overwrite: false


# =============================================================================
# Search parameters — unified across all tools
# =============================================================================
# These values are translated to tool-specific syntax by each runner.
# Tools that do not support a particular parameter ignore it silently.

search_params:

  # Enzyme used for in-silico digestion.
  # Supported values: trypsin | trypsin/p | lysc | gluc | aspn | argc |
  #                   chymotrypsin | non-specific | no-cleave
  # "trypsin/p" = trypsin allowing cleavage before proline (less stringent).
  # "no-cleave" = do not digest further; each FASTA entry is searched as-is.
  #               Use this for a pre-digested/peptide-level FASTA (e.g. the
  #               Entrapment module's entrapment peptide database) so tools
  #               don't cut those peptides into smaller fragments. Entries
  #               containing a non-standard residue (X/B/J/U/O/Z) are silently
  #               dropped by some tools (e.g. DIA-NN) since their mass is unknown.
  enzyme: trypsin/p

  # Maximum number of missed cleavage sites per peptide.
  missed_cleavages: 1

  # Peptide length range (number of amino acid residues).
  min_peptide_length: 6
  max_peptide_length: 30

  # Precursor (MS1) and fragment (MS2) mass tolerance in parts per million.
  # 10 ppm is a safe default for Orbitrap data; Astral data can often use 5 ppm.
  precursor_mass_tolerance_ppm: 10
  fragment_mass_tolerance_ppm: 10

  # Precursor charge state range to consider.
  min_charge: 2
  max_charge: 4

  # Precursor and fragment m/z windows (Dalton). Peaks outside these limits
  # are ignored. Adjust for your acquisition window.
  precursor_mz_range: [400.0, 1200.0]   # [min, max] in Da
  fragment_mz_range:  [200.0, 2000.0]   # [min, max] in Da

  # Modifications — use MaxQuant naming convention.
  # Currently supported: Carbamidomethyl (C) | Oxidation (M) | Phospho (STY) |
  #                       Acetyl (Protein N-term) | Deamidation (NQ)
  fixed_mods:
    - Carbamidomethyl (C)      # Alkylation of cysteine — usually fixed
  variable_mods:
    - Oxidation (M)            # Methionine oxidation — usually variable
  max_mods_per_peptide: 1      # Maximum variable modifications per peptide

  # FDR thresholds (decimal fraction; 0.01 = 1%).
  fdr_psm:     0.01   # PSM / precursor level FDR
  fdr_peptide: 0.01   # Unique peptide level FDR (ignored by tools without separate peptide FDR)
  fdr_protein: 0.01   # Protein group level FDR

  # Match-between-runs (MBR) — transfer identifications across runs using
  # retention time alignment. Requires multiple files in the same dataset.
  match_between_runs: true


# =============================================================================
# Datasets
# =============================================================================
# Each entry defines one MS dataset. The tool sections below reference these
# entries by name to select which datasets each tool should run on.
#
# Required keys per dataset:
#   path        — directory containing the raw MS files
#   acquisition — DDA (data-dependent) or DIA (data-independent)
#   format      — file format: raw | mzml | d | wiff | mgf
#   instrument  — instrument type (informational); used by FragPipe to pick workflow
#   fasta       — protein sequence database (FASTA format)
#
# Optional:
#   fasta_decoy — pre-built decoy FASTA. Other tools generate decoys
#                 internally and never need this. FragPipe needs one already
#                 appended, but generates it automatically via the Philosopher
#                 CLI bundled in its image (same command its GUI's "Add
#                 decoys" button runs) if this isn't set — cached next to
#                 `fasta` afterwards, so set this explicitly only to reuse a
#                 decoy FASTA you already have or point at a specific one.
#
# The default paths below assume you let `nextflow run setup.nf` download the
# datasets into ./data (relative to this project). When a dataset is actually
# downloaded, setup rewrites its entry with the real, absolute paths and the
# FASTA it detected inside the archive, so these defaults only apply to
# datasets you place by hand. See nextflow/datasets_catalog.yaml.

datasets:

  HYE_DDA_Orbitrap:
    path: data/HYE_DDA_Orbitrap
    acquisition: DDA
    format: raw
    instrument: Orbitrap
    fasta: data/HYE_DDA_Orbitrap/ProteoBenchFASTA_MixedSpecies_HYE.fasta

  HYE_DDA_Astral:
    path: data/HYE_DDA_Astral
    acquisition: DDA
    format: raw
    instrument: Astral
    fasta: data/HYE_DDA_Astral/ProteoBenchFASTA_MixedSpecies_HYE.fasta

  HYE_Astral:
    path: data/HYE_Astral
    acquisition: DIA
    format: raw
    instrument: Astral
    fasta: data/HYE_Astral/ProteoBenchFASTA_MixedSpecies_HYE.fasta

  HYE_Astral_mzml:
    path: data/HYE_Astral_mzml
    acquisition: DIA
    format: mzml
    instrument: Astral
    fasta: data/HYE_Astral/ProteoBenchFASTA_MixedSpecies_HYE.fasta

  HYE_Astral_Single_Cell:
    path: data/HYE_Astral_Single_Cell
    acquisition: DIA
    format: raw
    instrument: Astral
    fasta: data/HYE_Astral_Single_Cell/ProteoBenchFASTA_DDAQuantification_noecoli.fasta

  HYE_AIF:
    path: data/HYE_AIF
    acquisition: DIA
    format: raw
    instrument: Orbitrap
    fasta: data/HYE_AIF/ProteoBenchFASTA_MixedSpecies_HYE.fasta

  HYE_diaPASEF:
    path: data/HYE_diaPASEF
    acquisition: DIA
    format: d       # Bruker .d directory format (timsTOF)
    instrument: timstof
    fasta: data/HYE_diaPASEF/ProteoBenchFASTA_MixedSpecies_HYE.fasta

  HYE_ZenoSWATH:
    path: data/HYE_ZenoSWATH
    acquisition: DIA
    format: wiff    # SCIEX .wiff format (ZenoTOF)
    instrument: ZenoTOF
    fasta: data/HYE_ZenoSWATH/ProteoBenchFASTA_MixedSpecies_HYE.fasta

  PYE_diaPASEF:
    path: data/PYE_diaPASEF
    acquisition: DIA
    format: d
    instrument: timstof
    fasta: data/PYE_diaPASEF/ProteoBenchFASTA_MixedSpecies_HYE.fasta

  Entrapment_DIA:
    path: data/Entrapment_DIA
    acquisition: DIA
    format: raw
    instrument: Orbitrap
    fasta: data/Entrapment_DIA/ProteoBenchFASTA_Entrapment_Human.fasta


# =============================================================================
# Tools
# =============================================================================
# Each tool section lists:
#   versions — one entry per installed docker image; set enabled: false to skip
#   datasets — which datasets (by name) this tool should run on
#   extra    — tool-specific options not covered by search_params
#
# 'image:' and any *_bin/*_dir path inside it are filled in automatically by
# `nextflow run setup.nf`. Only enabled versions are run. Disabling a version
# is safe — it keeps the configuration for future use without executing the tool.

tools:

  # ---------------------------------------------------------------------------
  # DIA-NN — supports both DDA (v2.1+) and DIA
  # Docker images (quantms): https://quantmsdiann.quantms.org/containers/
  #   1.8.1 — biocontainers/diann, public, no token needed
  #   2.x   — ghcr.io/bigbio/diann, needs a GitHub token (read:packages scope)
  # Set up with: nextflow run setup.nf
  # ---------------------------------------------------------------------------
  diann:
    versions:
      # supports_dda: true from version 2.1.0 onward; older versions are DIA-only
      - id: "2.5.0"
        image: ghcr.io/bigbio/diann:2.5.0
        diann_bin: CHANGE_ME    # in-container path, auto-detected by setup.nf
        supports_dda: true
        enabled: false   # set to true once image is pulled

      - id: "1.8.1"
        image: biocontainers/diann:v1.8.1_cv1
        diann_bin: /usr/diann/1.8.1/diann
        supports_dda: false
        enabled: false

    # List dataset names from the datasets section above that DIA-NN should run on.
    # DDA datasets are automatically skipped for versions where supports_dda: false.
    datasets:
      - Entrapment_DIA
      # - HYE_Astral
      # - HYE_Astral_Single_Cell
      # - HYE_diaPASEF
      # - HYE_DDA_Orbitrap    # requires supports_dda: true version

    extra:
      # Path to a pre-built spectral library (.tsv/.speclib/.predicted.speclib).
      # Leave empty for library-free mode (DIA-NN generates its own library).
      library: ""

  # ---------------------------------------------------------------------------
  # AlphaDIA — DIA only
  # Docker image: mannlabs/alphadia:latest
  # https://github.com/MannLabs/alphadia/blob/main/docs/installation.md
  # Set up with: nextflow run setup.nf
  # ---------------------------------------------------------------------------
  alphadia:
    versions:
      - id: "latest"
        image: mannlabs/alphadia:latest
        gpu: false   # set true to pass --gpus all (needs the NVIDIA container toolkit)
        enabled: false

    datasets:
      - Entrapment_DIA
      # - HYE_Astral
      # - HYE_Astral_Single_Cell

    extra:
      library: ""

  # ---------------------------------------------------------------------------
  # Sage — DDA only; requires mzML input (not raw/d/wiff)
  # Docker image: ghcr.io/lazear/sage:latest
  # For mzML conversion of Thermo raw files use ThermoRawFileParser.
  # Set up with: nextflow run setup.nf
  # ---------------------------------------------------------------------------
  sage:
    versions:
      - id: "latest"
        image: ghcr.io/lazear/sage:latest
        sage_bin: /app/sage   # in-container path
        enabled: false

    # Sage requires mzML format. Add mzML DDA datasets here once available.
    datasets: []
    # datasets:
    #   - HYE_DDA_Orbitrap    # only works if format: mzml

    extra:
      write_pin: true    # write Percolator PIN file alongside results
      parquet: false     # write results in Parquet format instead of TSV

  # ---------------------------------------------------------------------------
  # FragPipe — supports DDA and DIA
  # Docker image: fcyucn/fragpipe:latest (does NOT include the separately
  # academic-licensed MSFragger/IonQuant/diaTracer JARs)
  # Set up with: nextflow run setup.nf   — it will interactively ask whether
  # you already have those JARs (as a downloaded zip/folder) or want to skip
  # FragPipe for now.
  # ---------------------------------------------------------------------------
  fragpipe:
    versions:
      - id: "24.0"
        image: fcyucn/fragpipe:latest
        fragpipe_root: CHANGE_ME       # in-container path, auto-detected by setup.nf
        jars_dir: CHANGE_ME/tools/fragpipe_jars   # host dir with the 3 licensed JARs
        container_python: /usr/bin/python3        # bundled in the image, do not change
        enabled: false

    datasets:
      - Entrapment_DIA
      # - HYE_Astral
      # - HYE_diaPASEF
      # - HYE_DDA_Orbitrap

    extra:
      # FragPipe workflows are selected automatically based on acquisition type and instrument.
      # Override here only if you want to force a specific workflow file.
      dda_workflow:       LFQ-MBR                        # used for DDA datasets
      dia_workflow:       DIA_SpecLib_Quant               # used for DIA (non-PASEF) datasets
      dia_pasef_workflow: DIA_SpecLib_Quant_diaPASEF      # used for diaPASEF (instrument: timstof)

  # ---------------------------------------------------------------------------
  # MaxQuant — supports DDA and DIA
  # Docker images: quay.io/medbioinf/maxquant:2.6.3.0 and :2.8.1.0 (Max Planck
  # academic license). Pin explicit version tags, not :latest — :latest drifts
  # between MaxQuant versions and would break the recorded maxquant_dll path.
  # Set up with: nextflow run setup.nf
  # ---------------------------------------------------------------------------
  maxquant:
    versions:
      - id: "2.6.3.0"
        image: quay.io/medbioinf/maxquant:2.6.3.0
        maxquant_dll: /opt/MaxQuant_v2.6.3.0/bin/MaxQuantCmd.dll   # in-container path
        enabled: false
      - id: "2.8.1.0"
        image: quay.io/medbioinf/maxquant:2.8.1.0
        maxquant_dll: /opt/MaxQuant_v2.8.1.0/bin/MaxQuantCmd.dll   # in-container path
        enabled: false

    datasets:
      - Entrapment_DIA
      # - HYE_DDA_Orbitrap
      # - HYE_Astral

    extra: {}

  # ---------------------------------------------------------------------------
  # MetaMorpheus — DDA only
  # Docker image: smithchemwisc/metamorpheus:latest
  # Set up with: nextflow run setup.nf
  # ---------------------------------------------------------------------------
  metamorpheus:
    versions:
      - id: "latest"
        image: smithchemwisc/metamorpheus:latest
        enabled: false

    # MetaMorpheus is DDA-only; add DDA datasets here
    datasets: []
    # datasets:
    #   - HYE_DDA_Orbitrap

    extra: {}
