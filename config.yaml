global:
  output_dir: /home/robbe/PB_output/results/MBRDIANN2.5
  max_parallel_jobs: 2
  threads_per_job: 32
  dotnet: /home/robbe/.dotnet/dotnet
  python: /usr/bin/python3
  overwrite: false   # set to true to rerun jobs whose output already exists

# All search conditions live here and are translated to tool-specific parameters
# by each runner's map_params() method. Tools that lack a given setting ignore it.
search_params:
  # Enzyme and digestion
  enzyme: trypsin/p            # trypsin | lysc | gluc | aspn | chymotrypsin
  missed_cleavages: 1
  min_peptide_length: 6
  max_peptide_length: 30

  # Mass tolerances (ppm)
  precursor_mass_tolerance_ppm: 10
  fragment_mass_tolerance_ppm: 10

  # Precursor charge and m/z filters
  min_charge: 2
  max_charge: 4
  precursor_mz_range: [400.0, 1200.0]  # [min, max] in Da
  fragment_mz_range: [200.0, 2000.0]   # [min, max] in Da

  # Modifications — names follow MaxQuant convention; mapped to tool-specific syntax in each runner
  fixed_mods:
    - Carbamidomethyl (C)
  variable_mods:
    - Oxidation (M)
  max_mods_per_peptide: 1

  # FDR thresholds (fraction, e.g. 0.01 = 1%)
  fdr_psm: 0.01       # PSM / precursor level
  fdr_peptide: 0.01   # peptide level (ignored by tools without a separate peptide FDR)
  fdr_protein: 0.01   # protein level

  # Match-between-runs
  match_between_runs: true

datasets:
  HYE_DDA_Orbitrap:
    path: /public/local/ProteoBench/HYE_DDA_Orbitrap
    acquisition: DDA
    format: raw
    instrument: Orbitrap
    fasta: /public/local/ProteoBench/fastas/ProteoBenchFASTA_MixedSpecies_HYE.fasta
    fasta_decoy: /public/local/ProteoBench/fastas/2025-04-01-decoys-ProteoBenchFASTA_DDAQuantification.fasta.fas

  HYE_DDA_Astral:
    path: /public/local/ProteoBench/HYE_DDA_Astral
    acquisition: DDA
    format: raw
    instrument: Astral
    fasta: /public/local/ProteoBench/fastas/ProteoBenchFASTA_MixedSpecies_HYE.fasta
    fasta_decoy: /public/local/ProteoBench/fastas/2025-04-01-decoys-ProteoBenchFASTA_DDAQuantification.fasta.fas

  HYE_Astral:
    path: /public/local/ProteoBench/HYE_Astral
    acquisition: DIA
    format: raw
    instrument: Astral
    fasta: /public/local/ProteoBench/fastas/ProteoBenchFASTA_MixedSpecies_HYE.fasta
    fasta_decoy: /public/local/ProteoBench/fastas/2025-04-01-decoys-ProteoBenchFASTA_DDAQuantification.fasta.fas

  HYE_Astral_mzml:
    path: /public/local/ProteoBench/HYE_Astral_mzml
    acquisition: DIA
    format: mzml
    instrument: Astral
    fasta: /public/local/ProteoBench/fastas/ProteoBenchFASTA_MixedSpecies_HYE.fasta
    fasta_decoy: /public/local/ProteoBench/fastas/2025-04-01-decoys-ProteoBenchFASTA_DDAQuantification.fasta.fas

  HYE_Astral_Single_Cell:
    path: /public/local/ProteoBench/HYE_Astral_Single_Cell
    acquisition: DIA
    format: raw
    instrument: Astral
    fasta: /public/local/ProteoBench/fastas/ProteoBenchFASTA_DDAQuantification_noecoli.fasta
    fasta_decoy: /public/local/ProteoBench/fastas/2026-04-26-decoys-ProteoBenchFASTA_DDAQuantification_noecoli.fasta.fas

  HYE_AIF:
    path: /public/local/ProteoBench/HYE_AIF
    acquisition: DIA
    format: raw
    instrument: Orbitrap
    fasta: /public/local/ProteoBench/fastas/ProteoBenchFASTA_MixedSpecies_HYE.fasta
    fasta_decoy: /public/local/ProteoBench/fastas/2025-04-01-decoys-ProteoBenchFASTA_DDAQuantification.fasta.fas

  HYE_diaPASEF:
    path: /public/local/ProteoBench/HYE_diaPASEF
    acquisition: DIA
    format: d
    instrument: timstof
    fasta: /public/local/ProteoBench/fastas/ProteoBenchFASTA_MixedSpecies_HYE.fasta
    fasta_decoy: /public/local/ProteoBench/fastas/2025-04-01-decoys-ProteoBenchFASTA_DDAQuantification.fasta.fas

  HYE_ZenoSWATH:
