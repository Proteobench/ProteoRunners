global:
  output_dir: ./results
  max_parallel_jobs: 2
  threads_per_job: 32
  dotnet: /home/robbe/.dotnet/dotnet
  python: /home/robbe/.pyenv/versions/proteorunner/bin/python3
  overwrite: false
search_params:
  enzyme: trypsin/p
  missed_cleavages: 1
  min_peptide_length: 6
  max_peptide_length: 30
  precursor_mass_tolerance_ppm: 10
  fragment_mass_tolerance_ppm: 10
  min_charge: 2
  max_charge: 4
  precursor_mz_range:
  - 400.0
  - 1200.0
  fragment_mz_range:
  - 200.0
  - 2000.0
  fixed_mods:
  - Carbamidomethyl (C)
  variable_mods:
  - Oxidation (M)
  max_mods_per_peptide: 1
  fdr_psm: 0.01
  fdr_peptide: 0.01
  fdr_protein: 0.01
  match_between_runs: true
datasets:
  HYE_DDA_Orbitrap:
    path: /public/local/ProteoBench/HYE_DDA_Orbitrap
    acquisition: DDA
    format: raw
    instrument: Orbitrap
    fasta: /public/local/ProteoBench/fastas/ProteoBenchFASTA_MixedSpecies_HYE.fasta
    fasta_decoy: /public/local/ProteoBench/fastas/2025-04-01-decoys-ProteoBenchFASTA_DDAQuantification.fasta.fas
  HYE_DDA_Astral:
