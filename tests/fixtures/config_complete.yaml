global:
  output_dir: results
  max_parallel_jobs: 1
  threads_per_job: 1

search_params:
  enzyme: trypsin/p

datasets:

  TINY_DDA:
    path: data/TINY_DDA
    acquisition: DDA
    format: raw
    instrument: Orbitrap
    fasta: data/TINY_DDA/HYE.fasta

tools:

  sage:
    versions:
      - id: "latest"
        image: hello-world:latest
        sage_bin: /app/sage
        enabled: true

    datasets:
      - TINY_DDA
